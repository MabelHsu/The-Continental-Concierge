<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Continental — Concierge Desk</title>
<style>
  /* ── Continental Concierge demo UI ──────────────────────────────────────────
     Single-file, zero-build. Served by FastAPI via StaticFiles.
     Talks to: POST /chat, GET /player/{session_id}, /missions, /inventory,
               GET /world-state.
     State: session_id persisted in localStorage so refresh keeps the run.
  ─────────────────────────────────────────────────────────────────────────── */

  :root {
    --bg: #0a0a0a;
    --panel: #111111;
    --panel-border: #2a2418;
    --ink: #e8dcc2;
    --ink-dim: #8a8168;
    --gold: #c9a961;
    --gold-dim: #8a7541;
    --blood: #6b1e1e;
    --ok: #4a6b3a;
    --warn: #b8832a;
    --font-serif: "Playfair Display", "Times New Roman", Georgia, serif;
    --font-mono: "JetBrains Mono", "Courier New", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-serif);
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at top, rgba(201, 169, 97, 0.04) 0%, transparent 60%),
      linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
  }

  .app {
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 60px 1fr 140px;
    grid-template-areas:
      "header header"
      "chat   hud"
      "input  hud";
    height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
    border-left: 1px solid var(--panel-border);
    border-right: 1px solid var(--panel-border);
  }

  /* ── Header ───────────────────────────────────────────────────────────── */
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--panel-border);
    background: #0a0806;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
  }
  header h1 .small { color: var(--ink-dim); font-size: 11px; margin-left: 10px; }
  .world {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
    text-align: right;
  }
  .world .crisis {
    display: inline-block;
    margin-left: 12px;
    padding: 2px 8px;
    border: 1px solid var(--panel-border);
    color: var(--warn);
  }

  /* ── Chat transcript ──────────────────────────────────────────────────── */
  .chat {
    grid-area: chat;
    overflow-y: auto;
    padding: 24px 32px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: var(--panel-border); }

  .msg {
    margin: 0 0 20px;
    max-width: 760px;
    line-height: 1.7;
    font-size: 15px;
  }
  .msg.player {
    color: var(--ink-dim);
    padding-left: 20px;
    border-left: 2px solid var(--gold-dim);
    font-style: italic;
  }
  .msg.concierge {
    color: var(--ink);
  }
  .msg.concierge .speaker {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .msg.system {
    color: var(--ink-dim);
    font-size: 12px;
    font-family: var(--font-mono);
    text-align: center;
    padding: 8px 0;
    border-top: 1px solid var(--panel-border);
    border-bottom: 1px solid var(--panel-border);
  }
  .msg.error {
    color: #b85858;
    font-family: var(--font-mono);
    font-size: 12px;
  }

  /* ── Input bar ────────────────────────────────────────────────────────── */
  .inputbar {
    grid-area: input;
    display: flex;
    align-items: center;
    padding: 16px 32px;
    border-top: 1px solid var(--panel-border);
    background: #0a0806;
    gap: 12px;
  }
  .inputbar textarea {
    flex: 1;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 15px;
    padding: 12px 14px;
    resize: none;
    height: 80px;
    outline: none;
    transition: border-color 0.2s;
  }
  .inputbar textarea:focus { border-color: var(--gold-dim); }
  .inputbar textarea::placeholder { color: var(--ink-dim); font-style: italic; }

  .inputbar button {
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 12px 22px;
    cursor: pointer;
    height: 80px;
    transition: all 0.15s;
  }
  .inputbar button:hover:not(:disabled) {
    background: var(--gold);
    color: #0a0806;
  }
  .inputbar button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .inputbar .reset {
    border-color: var(--panel-border);
    color: var(--ink-dim);
  }

  /* ── HUD ─────────────────────────────────────────────────────────────── */
  .hud {
    grid-area: hud;
    border-left: 1px solid var(--panel-border);
    background: #0a0806;
    overflow-y: auto;
    padding: 20px;
    font-size: 13px;
  }
  .hud::-webkit-scrollbar { width: 6px; }
  .hud::-webkit-scrollbar-thumb { background: var(--panel-border); }

  .hud h2 {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    margin: 20px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--panel-border);
  }
  .hud h2:first-child { margin-top: 0; }

  .identity .name {
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .identity .archetype {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .stats .row {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .stats .row .label { color: var(--ink-dim); }
  .stats .row .val { color: var(--ink); }

  ul.inventory, ul.missions {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.inventory li, ul.missions li {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 0;
    border-bottom: 1px dashed var(--panel-border);
    color: var(--ink);
  }
  ul.inventory li:last-child, ul.missions li:last-child { border-bottom: 0; }
  ul.missions li .rep { color: var(--warn); }
  .empty { color: var(--ink-dim); font-style: italic; font-size: 11px; }

  /* ── Responsive ───────────────────────────────────────────────────────── */
  @media (max-width: 860px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: 60px 1fr 120px;
      grid-template-areas:
        "header"
        "chat"
        "input";
    }
    .hud { display: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>The Continental <span class="small">Concierge Desk</span></h1>
      <div class="world" id="world">
        Day <span id="day">—</span> · <span id="phase">—</span>
        <span class="crisis">Crisis <span id="crisis">—</span></span>
      </div>
    </header>

    <main class="chat" id="chat">
      <div class="msg system">
        Present yourself at the front desk. The concierge will receive you.
      </div>
    </main>

    <div class="inputbar">
      <textarea
        id="input"
        placeholder="Address the concierge..."
        autocomplete="off"
      ></textarea>
      <button id="send">Send</button>
      <button id="reset" class="reset" title="Start a new session">New</button>
    </div>

    <aside class="hud" id="hud">
      <h2>Identity</h2>
      <div class="identity">
        <div class="name" id="playerName">—</div>
        <div class="archetype" id="playerArchetype">Not checked in</div>
      </div>

      <h2>Standing</h2>
      <div class="stats" id="stats">
        <div class="row"><span class="label">Gold</span><span class="val" id="gold">—</span></div>
        <div class="row"><span class="label">Rep</span><span class="val" id="rep">—</span></div>
        <div class="row"><span class="label">Location</span><span class="val" id="location">—</span></div>
        <div class="row"><span class="label">Path</span><span class="val" id="path">—</span></div>
      </div>

      <h2>Inventory</h2>
      <ul class="inventory" id="inventory"><li class="empty">Empty</li></ul>

      <h2>Available Missions</h2>
      <ul class="missions" id="missions"><li class="empty">None offered</li></ul>
    </aside>
  </div>

<script>
/* ── Client ──────────────────────────────────────────────────────────────────
   Persists session_id in localStorage so refreshing keeps the run going.
   Every /chat response already includes the player snapshot — we use it to
   refresh the HUD, then only call /inventory and /missions on check-in so
   we don't hammer the DB on every turn.
─────────────────────────────────────────────────────────────────────────── */

const API = "";  // same-origin; server.py serves this file + the API
const SESSION_KEY = "cc.session_id";
const USER_KEY    = "cc.user_id";

const $ = (id) => document.getElementById(id);
const chatEl = $("chat");
const inputEl = $("input");
const sendBtn = $("send");
const resetBtn = $("reset");

let sessionId = localStorage.getItem(SESSION_KEY) || crypto.randomUUID();
let userId    = localStorage.getItem(USER_KEY)    || "guest-" + sessionId.slice(0, 8);
localStorage.setItem(SESSION_KEY, sessionId);
localStorage.setItem(USER_KEY, userId);

let lastOnboardingComplete = false;

function addMessage(kind, text, speaker) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  if (speaker) {
    const s = document.createElement("span");
    s.className = "speaker";
    s.textContent = speaker;
    el.appendChild(s);
  }
  const body = document.createElement("span");
  body.textContent = text;
  el.appendChild(body);
  chatEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
  return el;
}

function renderPlayer(player) {
  if (!player) {
    $("playerName").textContent = "—";
    $("playerArchetype").textContent = "Not checked in";
    $("gold").textContent = "—";
    $("rep").textContent = "—";
    $("location").textContent = "—";
    $("path").textContent = "—";
    return;
  }
  $("playerName").textContent = player.name || "(unnamed)";
  $("playerArchetype").textContent = player.archetype || player.creation_path || "—";
  $("gold").textContent = player.gold_coins ?? "—";
  $("rep").textContent = player.reputation ?? "—";
  $("location").textContent = player.location_name || player.current_location || "Continental";
  $("path").textContent = player.creation_path || "—";
}

function renderInventory(items) {
  const ul = $("inventory");
  ul.innerHTML = "";
  if (!items || items.length === 0) {
    ul.innerHTML = '<li class="empty">Empty</li>';
    return;
  }
  for (const it of items) {
    const li = document.createElement("li");
    const qty = it.quantity > 1 ? ` ×${it.quantity}` : "";
    li.textContent = (it.item_name || it.name || "unknown") + qty;
    ul.appendChild(li);
  }
}

function renderMissions(missions) {
  const ul = $("missions");
  ul.innerHTML = "";
  if (!missions || missions.length === 0) {
    ul.innerHTML = '<li class="empty">None offered</li>';
    return;
  }
  for (const m of missions) {
    const li = document.createElement("li");
    const rep = m.min_reputation != null ? ` · <span class="rep">rep ${m.min_reputation}+</span>` : "";
    li.innerHTML = (m.title || m.name || "Unknown mission") + rep;
    ul.appendChild(li);
  }
}

function renderWorld(data) {
  if (!data) return;
  $("day").textContent = data.story_day ?? data.day ?? "—";
  $("phase").textContent = data.story_phase ?? data.phase ?? "—";
  $("crisis").textContent = data.crisis_level ?? "—";
}

async function refreshHUD(player) {
  renderPlayer(player);
  if (!player || !player.onboarding_complete) return;
  try {
    const [invRes, missRes] = await Promise.all([
      fetch(`${API}/player/${sessionId}/inventory`),
      fetch(`${API}/player/${sessionId}/missions`),
    ]);
    if (invRes.ok) {
      const inv = await invRes.json();
      renderInventory(inv.inventory || []);
    }
    if (missRes.ok) {
      const miss = await missRes.json();
      renderMissions(miss.missions || []);
    }
  } catch (e) {
    console.warn("HUD refresh failed", e);
  }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  sendBtn.disabled = true;
  addMessage("player", text);

  const thinking = addMessage("system", "The concierge considers your request…");

  try {
    const res = await fetch(`${API}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        session_id: sessionId,
        user_id: userId,
      }),
    });

    thinking.remove();

    if (!res.ok) {
      const detail = await res.text();
      addMessage("error", `Request failed (${res.status}): ${detail.slice(0, 200)}`);
      return;
    }

    const data = await res.json();
    addMessage("concierge", data.response || "(silence)", "Concierge");

    renderWorld(data);
    // Trigger a full HUD refresh when onboarding flips complete, or every few turns.
    const flipped = data.onboarding_complete && !lastOnboardingComplete;
    lastOnboardingComplete = !!data.onboarding_complete;
    await refreshHUD(data.player);
  } catch (e) {
    thinking.remove();
    addMessage("error", `Network error: ${e.message}`);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

async function loadInitial() {
  try {
    const [playerRes, worldRes] = await Promise.all([
      fetch(`${API}/player/${sessionId}`),
      fetch(`${API}/world-state`),
    ]);
    if (worldRes.ok) {
      const w = await worldRes.json();
      renderWorld({
        story_day: w.day,
        story_phase: w.phase,
        crisis_level: w.crisis_level,
      });
    }
    if (playerRes.ok) {
      const p = await playerRes.json();
      if (p.player) {
        lastOnboardingComplete = !!p.onboarding_complete;
        await refreshHUD(p.player);
      }
    }
  } catch (e) {
    // Backend might not be up yet on the very first load — that's fine.
    console.warn("initial load skipped", e);
  }
}

function resetSession() {
  if (!confirm("Start a new session? Current run will be abandoned.")) return;
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(USER_KEY);
  location.reload();
}

sendBtn.addEventListener("click", sendMessage);
resetBtn.addEventListener("click", resetSession);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

loadInitial();
inputEl.focus();
</script>
</body>
</html>
